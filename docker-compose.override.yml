services:
  llm-bridge:
    image: alpine/socat:latest
    command: TCP-LISTEN:11434,fork,reuseaddr TCP:host.docker.internal:11434
    extra_hosts:
    - host.docker.internal:host-gateway
    networks:
    - workbench_net
    - host_net
    restart: unless-stopped
networks:
  host_net:
    driver: bridge

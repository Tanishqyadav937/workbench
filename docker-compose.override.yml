services:
  llm-bridge:
    image: nginx:alpine
    volumes:
      - ./llm-bridge-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      workbench_net:
        aliases: [ollama.internal, llm-bridge]
      host_net:
    restart: unless-stopped

networks:
  host_net:
    driver: bridge

# Auto-loaded next to docker-compose.yml.
# llm-bridge: the single narrow path from internal services to Ollama on the host (docs/LLM_ACCESS.md)
# ledger + model-gateway: Phase 1 services, internal network only, NO published ports.
services:
  llm-bridge:
    image: nginx:alpine
    volumes:
      - ./llm-bridge-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      workbench_net:
        aliases: [ollama.internal, llm-bridge]
      host_net:
    restart: unless-stopped

  ledger:
    build:
      context: .
      dockerfile: apps/ledger/Dockerfile
    environment:
      LEDGER_DB: /data/ledger.db
    volumes:
      - ledger_data:/data
    networks: [workbench_net]
    restart: unless-stopped

  model-gateway:
    build:
      context: .
      dockerfile: apps/model_gateway/Dockerfile
    environment:
      LEDGER_URL: http://ledger:8100
      LEDGER_STRICT: "1"
    volumes:
      - ./config:/config:ro
    networks: [workbench_net]
    depends_on: [ledger, llm-bridge]
    restart: unless-stopped

volumes:
  ledger_data:

networks:
  host_net:
    driver: bridge

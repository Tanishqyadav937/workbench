server {
    listen 11434;
    client_max_body_size 50m;
    location / {
        proxy_pass http://host.docker.internal:11434;
        proxy_set_header Host localhost:11434;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
